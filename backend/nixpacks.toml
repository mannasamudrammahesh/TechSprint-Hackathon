[phases.setup]
nixPkgs = ["python311"]
aptPkgs = ["ffmpeg"]

[phases.install]
cmds = ["pip install --no-cache-dir -r backend/requirements.railway.txt"]

[phases.build]
cmds = ["echo 'Build complete'"]

[start]
cmd = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"

[variables]
PYTHON_VERSION = "3.11.9"
