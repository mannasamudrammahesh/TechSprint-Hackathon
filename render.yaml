services:
  - type: web
    name: healix-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements-minimal.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: PIP_CACHE_DIR
        value: "/opt/render/project/.pip-cache"
    healthCheckPath: /health